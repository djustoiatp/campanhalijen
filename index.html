    '<p class="muted" style="font-size:.92rem">A participação é voluntária e não muda em nada o cuidado com o seu familiar.</p></div>'+
'</div></div></section>'+

'<section class="block" id="comprovante"><div class="wrap"><span class="eyebrow">Já doou?</span><h2>Envie seu comprovante para acompanharmos</h2><div class="proof">'+
  '<ol class="how"><li><span><b>Preencha o valor</b> e, se quiser, o seu nome.</span></li><li><span><b>Toque em “Anexar comprovante no WhatsApp”.</b> A mensagem para o Lar já vai pronta.</span></li><li><span><b>No WhatsApp, toque no clipe 📎</b> e anexe a foto ou o print do comprovante.</span></li><li><span><b>Pronto.</b> Depois de conferida, sua doação entra no valor arrecadado desta página.</span></li></ol>'+
  '<form class="card" id="f-proof" novalidate><div class="form">'+
    '<div class="field"><label for="p-valor">Valor doado (R$)</label><input id="p-valor" inputmode="decimal" placeholder="Ex.: 100,00" required></div>'+
    '<div class="field"><label for="p-data">Data do PIX</label><input id="p-data" type="date"></div>'+
    '<div class="field" style="grid-column:1/-1"><label for="p-nome">Seu nome ou da família (opcional)</label><input id="p-nome" placeholder="Ex.: Família de Dona Maria"></div>'+
  '</div><a class="btn btn-wa" id="p-send" href="https://wa.me/'+esc(st.whatsapp)+'" target="_blank" rel="noopener">'+waIcon()+'Anexar comprovante no WhatsApp</a>'+
  '<p class="msg err" id="p-msg" role="status"></p>'+
  '<p class="muted" style="font-size:.88rem">O comprovante vai direto para o WhatsApp do Lar, (81) 98536-1401. Esta página não guarda seus dados.</p></form>'+
'</div></div></section>'+
'<section class="block" id="transparencia"><div class="wrap"><span class="eyebrow">Transparência</span><h2>Prestação de contas, etapa por etapa</h2>'+
  '<ol class="steps">'+st.etapas.filter(function(e){return e.s!=="oculto";}).map(function(e,i){var lab={feito:"Concluído",andamento:"Em andamento",pendente:"Pendente"}[e.s]||"Pendente";return '<li class="step"><span class="n">0'+(i+1)+'</span><span class="chip '+esc(e.s)+'">'+lab+'</span><h3>'+esc(e.t)+'</h3><p>'+esc(e.n)+'</p></li>';}).join("")+'</ol>'+
  '<ul class="commit"><li>Cada doação conferida entra no valor arrecadado desta página.</li><li>Os nomes de quem doa não são divulgados.</li><li>Nota fiscal e foto do freezer publicadas aqui após a compra.</li><li>'+esc(st.excedente)+'</li></ul>'+
'</div></section>'+

'<div class="wrap" id="admin-slot"></div>'+
'</main>'+
'<footer><div class="wrap"><span>Lar dos Idosos Jesus de Nazaré · CNPJ 08.766.955/0001-66 · Rua Santa Luzia, 446, Cruz de Rebouças, Igarassu–PE</span><button class="admin-toggle" type="button" id="admin-toggle" hidden>Área da administração</button></div></footer>'+
'<div class="toast" id="toast" role="status" hidden></div>';
}

function buildDoc(st){
  var json=JSON.stringify(st).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>Campanha Freezer LIJEN</title>'+FONTS+
    '<style id="css">'+CSS_SRC+'</style>'+
    '<div id="app">'+renderBody(st)+'</div>'+
    '<script type="application/json" id="state">'+json+'<\/script>'+
    '<script id="main">'+MAIN_SRC+'<\/script></body></html>';
}

var app=document.getElementById("app");
app.innerHTML=renderBody(STATE);

/* Comprovante pelo WhatsApp */
(function(){
  var f=document.getElementById("f-proof"); if(!f)return;
  var v=document.getElementById("p-valor"),d=document.getElementById("p-data"),n=document.getElementById("p-nome"),a=document.getElementById("p-send"),m=document.getElementById("p-msg");
  d.value=new Date().toLocaleDateString("en-CA",{timeZone:"America/Recife"});
  function val(){var s=String(v.value||"").replace(/[^\d,.-]/g,"");if(s.indexOf(",")>-1){s=s.replace(/\./g,"").replace(",",".");}var x=parseFloat(s);return isFinite(x)&&x>0?Math.round(x*100)/100:0;}
  function upd(){
    var x=val(), nome=n.value.trim();
    var txt="Olá! Fiz uma doação para a campanha do freezer do Lar Jesus de Nazaré.\n\n"+
      "Valor: "+(x?brl(x):"(informar)")+"\n"+
      "Data do PIX: "+(d.value?dmy(d.value):"(informar)")+"\n"+
      "Nome: "+(nome||"Prefiro não informar")+"\n"+
      "\n"+
      "Segue o comprovante 👇";
    a.href="https://wa.me/"+STATE.whatsapp+"?text="+encodeURIComponent(txt);
    if(x)m.textContent="";
  }
  [v,d,n].forEach(function(el){el.addEventListener("input",upd);el.addEventListener("change",upd);});
  f.addEventListener("submit",function(ev){ev.preventDefault();});
  a.addEventListener("click",function(ev){if(!val()){ev.preventDefault();m.textContent="Informe o valor doado antes de enviar, por exemplo 100 ou 50,00.";v.focus();}});
  upd();
})();

var toast=document.getElementById("toast"),tt;
function show(m){toast.textContent=m;toast.hidden=false;clearTimeout(tt);tt=setTimeout(function(){toast.hidden=true;},2600);}
document.getElementById("copy-pix").addEventListener("click",function(){
  var code=document.getElementById("pix");
  function sel(){var r=document.createRange();r.selectNodeContents(code);var s=window.getSelection();s.removeAllRanges();s.addRange(r);show("Chave selecionada. Toque e segure para copiar.");}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(STATE.pixKey).then(function(){show("Chave PIX copiada. Obrigado!");},sel);}else{sel();}
});

/* ---------- Administração ---------- */
var art=null, readOnly=false;
function adminHTML(st){
  var list=st.doacoes.slice().sort(function(a,b){return (b.data||"").localeCompare(a.data||"");}).map(function(d){
    return '<div class="adm-row" data-id="'+d.id+'"><span><b class="num">'+brl(d.valor)+'</b> · '+esc(dmy(d.data))+' · '+(d.nome?esc(d.nome):'sem nome')+(d.exibir?' (nome público)':'')+'</span>'+
      '<span class="act"><button class="btn btn-line mini" type="button" data-del="'+d.id+'">Remover</button></span></div>';}).join("")||'<p class="muted">Nenhuma doação registrada.</p>';
  var steps=st.etapas.map(function(e,i){return '<div class="step-edit"><div class="field"><label>Etapa '+(i+1)+'</label><input id="et-t-'+i+'" value="'+esc(e.t)+'"></div>'+
    '<div class="field"><label for="et-s-'+i+'">Situação</label><select id="et-s-'+i+'"><option value="pendente"'+(e.s==="pendente"?" selected":"")+'>Pendente</option><option value="andamento"'+(e.s==="andamento"?" selected":"")+'>Em andamento</option><option value="feito"'+(e.s==="feito"?" selected":"")+'>Concluído</option></select></div>'+
    '<div class="field"><label for="et-n-'+i+'">Detalhe público</label><input id="et-n-'+i+'" value="'+esc(e.n)+'"></div></div>';}).join("");
  return '<section class="admin" id="admin" aria-labelledby="adm-t"><div><span class="eyebrow">Somente administração</span><h2 id="adm-t">Registrar doação</h2><p class="muted">Ao salvar, a página é atualizada para todas as pessoas que têm o link.</p></div>'+
    '<form class="form" id="f-add"><div class="field"><label for="d-valor">Valor (R$)</label><input id="d-valor" inputmode="decimal" placeholder="100,00" required></div>'+
    '<div class="field"><label for="d-data">Data</label><input id="d-data" type="date" required></div>'+
    '<div class="field"><label for="d-nome">Nome do doador (opcional)</label><input id="d-nome" placeholder="Ex.: Família de Dona Maria"></div>'+
    '<div class="field"><label for="d-forma">Forma</label><select id="d-forma"><option>PIX</option><option>Dinheiro</option><option>Transferência</option></select></div>'+
    '<div style="grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><button class="btn btn-blue" type="submit">Registrar e publicar</button><span class="msg" id="m-add" role="status"></span></div></form>'+
    '<div><h3 style="margin-bottom:10px">Doações registradas</h3><div class="adm-list">'+list+'</div><p class="msg" id="m-del" role="status"></p></div>'+
    '<div><h3 style="margin-bottom:10px">Etapas da prestação de contas</h3><div style="display:flex;flex-direction:column;gap:12px">'+steps+
      '<div class="field"><label for="exc">Valor excedente (texto público)</label><input id="exc" value="'+esc(st.excedente)+'"></div>'+
      '<div class="step-edit"><div class="field"><label for="meta">Meta (R$)</label><input id="meta" inputmode="decimal" value="'+st.meta+'"></div><div class="field"><label for="prazo">Prazo</label><input id="prazo" type="date" value="'+esc(st.prazo)+'"></div><div></div></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><button class="btn btn-blue" type="button" id="save-et">Salvar etapas e publicar</button><span class="msg" id="m-et" role="status"></span></div></div></div>'+
  '</section>';
}
function setMsg(id,txt,kind){var el=document.getElementById(id);if(el){el.textContent=txt;el.className="msg"+(kind?" "+kind:"");}}
function publish(next,msgId){
  next.atualizado=new Date().toISOString();
  setMsg(msgId,"Publicando…","");
  document.querySelectorAll("#admin button").forEach(function(b){b.disabled=true;});
  art.publish(buildDoc(next)).then(function(){setMsg(msgId,"Publicado. A página está sendo atualizada para todos.","ok");},function(e){
    document.querySelectorAll("#admin button").forEach(function(b){b.disabled=false;});
    var c=e&&e.code;
    if(c==="conflict"){setMsg(msgId,"Outra pessoa atualizou a página agora. Recarregando a versão mais nova…","");}
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"){readOnly=true;setMsg(msgId,"Você pode ver a página, mas só a administração do Lar pode registrar doações.","err");}
    else if(c==="rate_limited"){setMsg(msgId,"Muitas alterações seguidas. Aguarde um minuto e tente de novo.","err");}
    else{setMsg(msgId,"Não foi possível publicar agora. Tente de novo em instantes.","err");}
  });
}
function parseMoney(s){s=String(s||"").replace(/[^\d,.-]/g,"");if(s.indexOf(",")>-1){s=s.replace(/\./g,"").replace(",",".");}var v=parseFloat(s);return isFinite(v)?Math.round(v*100)/100:NaN;}
function openAdmin(){
  var slot=document.getElementById("admin-slot");
  if(document.getElementById("admin")){document.getElementById("admin").scrollIntoView({behavior:"smooth"});return;}
  slot.innerHTML=adminHTML(STATE);
  var today=new Date().toLocaleDateString("en-CA",{timeZone:"America/Recife"});document.getElementById("d-data").value=today;
  document.getElementById("f-add").addEventListener("submit",function(ev){
    ev.preventDefault();
    var v=parseMoney(document.getElementById("d-valor").value);
    if(!(v>0)){setMsg("m-add","Informe um valor maior que zero, por exemplo 100 ou 50,00.","err");return;}
    var next=JSON.parse(JSON.stringify(STATE));
    var maxId=next.doacoes.reduce(function(a,d){return Math.max(a,d.id||0);},0);
    next.doacoes.push({id:maxId+1,data:document.getElementById("d-data").value||today,valor:v,nome:document.getElementById("d-nome").value.trim().slice(0,60),exibir:false,forma:document.getElementById("d-forma").value});
    publish(next,"m-add");
  });
  slot.querySelectorAll("[data-del]").forEach(function(b){b.addEventListener("click",function(){
    var id=+b.getAttribute("data-del");
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirmar remoção";b.className="btn btn-red mini";return;}
    var next=JSON.parse(JSON.stringify(STATE));next.doacoes=next.doacoes.filter(function(d){return d.id!==id;});publish(next,"m-del");
  });});
  document.getElementById("save-et").addEventListener("click",function(){
    var next=JSON.parse(JSON.stringify(STATE));
    next.etapas=next.etapas.map(function(e,i){return {t:document.getElementById("et-t-"+i).value.trim()||e.t,s:document.getElementById("et-s-"+i).value,n:document.getElementById("et-n-"+i).value.trim()};});
    next.excedente=document.getElementById("exc").value.trim()||STATE.excedente;
    var m=parseMoney(document.getElementById("meta").value);if(m>0)next.meta=m;
    var p=document.getElementById("prazo").value;if(p)next.prazo=p;
    publish(next,"m-et");
  });
  slot.querySelector("#admin").scrollIntoView({behavior:"smooth"});
}
if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(function(ns){
    if(!ns)return; art=ns;
    var showToggle=function(){var b=document.getElementById("admin-toggle");b.hidden=false;b.addEventListener("click",openAdmin);};
    window.claude.use("user").then(function(u){
      if(!u){showToggle();return;}
      var can=null;try{can=u.canEdit();}catch(e){can=null;}
      Promise.resolve(can).then(function(v){if(v!==false)showToggle();},function(){showToggle();});
    },function(){showToggle();});
  },function(){});
}
})();
</script>
